# Valori predefiniti di hringr.py. La riga di comando ha la precedenza.
# Le chiavi sono i nomi delle opzioni (--shape -> shape; i trattini diventano "_" o "-", entrambi vanno bene).
[hringr]
# Forma di ciò che si dirige verso il cerchio:
#   triangles = triangoli chiari      bubbles = mini cerchi, come bolle subacquee
# (quello che esce dal cerchio resta sempre fatto di triangoli azzurri)
shape = bubbles

# Effetto dentro il cerchio:
#   pulse  = anelli che partono dal centro (battito)
#   liquid = liquido che si muove nel cerchio, come la "palla" degli assistenti vocali
inner = liquid

# Colore del liquido: esadecimale RRGGBB, SENZA "#" (in questo file "#" inizia un commento).
# Esempi: 0083C8 azzurro (predefinito), 7B5CFF viola, 22C55E verde, FF7A1A arancio
liquid_color = 0083C8

# Effetto interno: la CPU ne determina la velocità, la RAM la luminosità (non è configurabile).

# Dimensione delle forme (1.0 = normale)
tri_size = 0.6

# Sorgente dell'audio: auto | bridge | loopback
#   auto     = bridge se raggiungibile, altrimenti cattura dalla scheda audio (va bene ovunque)
#   bridge   = barre di cava lette da un servizio HTTP "mpd-spectrum" (impianto personalizzato di MPD: non
#              esiste di serie, quindi non è il predefinito)
#   loopback = cattura diretta dell'audio in uscita
# Le impostazioni di una singola macchina (es. audio_source = bridge) vanno in config.local.ini,
# stessa cartella, non tracciato da git: ha la precedenza su questo file.
audio_source = auto

# Opzioni del bridge e della cattura diretta (valgono per desktop e web), da adattare nel file locale:
# bridge_url = http://127.0.0.1:44883/bars
# bridge_scale = 22        # media delle barre (0-100) = livello massimo
# audio_device =           # parte del nome del dispositivo, solo per audio_source = loopback
# audio_gain = 0           # dB aggiunti

# Mbit/s corrispondenti all'effetto massimo di download/upload
max_mbps = 200

# Monitor: auto = quello del terminale da cui si lancia, oppure indice (0, 1, ...)
display = auto

# ---------------------------------------------------------------- journal di systemd
# Mostra in tempo reale i messaggi di journald sopra l'anello: una corsia per unità/servizio, un punto per messaggio.
# Un punto dice solo "questo servizio ha registrato un messaggio": non implica un legame tra servizi.
# Sola lettura (journalctl -f), i messaggi restano in memoria e non escono dalla macchina.
[journal]
enabled = yes

# Chi può vedere il journal.
#   no        = solo da localhost (apri http://localhost:8766/ sulla macchina stessa)
#   tailscale = anche da localhost e dai dispositivi della tua tailnet (100.64.0.0/10), aprendo la pagina con
#               l'IP tailscale, il nome *.ts.net o l'hostname di questa macchina; il resto della rete resta escluso
#   yes       = da qualunque rete: i log possono contenere nomi utente, indirizzi IP, percorsi e a volte segreti.
# Abilitalo solo su una rete fidata; la porta non ha autenticazione.
network = no

# Messaggi tenuti in memoria nella pagina (oltre, i più vecchi vengono scartati) e lunghezza massima del testo
max_events = 600
message_max = 200

# Secondi visibili nella timeline, numero massimo di corsie (le unità meno attive si fondono in "altri")
window_s = 90
max_lanes = 8

# Verso: ltr = i messaggi nascono a sinistra e scorrono verso destra, rtl = il contrario
direction = ltr

# Zona occupata (frazione dell'altezza, dal basso) e opacità del pannello
height = 0.4
opacity = 0.9

# Dimensione del testo nelle bubble: 1 = 1,6% dell'altezza della finestra (leggibile da lontano), minimo 12 px.
# 1.3 = più grande, 0.8 = più piccolo (massimo 3)
font_scale = 1

# Testo di stato dentro l'anello (es. "starting", "stream interrupted"): yes = mostrato, no = nascosto
status_label = yes

# Quanto la priorità tinge l'anello: liquido, bordo luminoso, alone ed eco (0 = per nulla, 1 = al massimo; il liquido richiede inner = liquid)
ring_tint = 0.9

# Colori per priorità, RRGGBB senza "#", in ordine: emerg, alert, crit, err, warning, notice, info, debug
colors = B026FF, B026FF, FF2D55, FF7A1A, FFD60A, 5AC8FA, 0A84FF, 8E8E93

# Salvataggio su file: VUOTO = non salva nulla. Se serve, usa un percorso in RAM per non consumare la SD,
# es. /dev/shm/hringr-journal.jsonl (tmpfs, sparisce al riavvio). Il file viene azzerato oltre save_max_kb.
save_path =
save_max_kb = 1024
