# Valori predefiniti di hringr.py. La riga di comando ha la precedenza.
# Le chiavi sono i nomi delle opzioni (--shape -> shape; i trattini diventano "_" o "-", entrambi vanno bene).
[hringr]
# Forma di ciò che si dirige verso il cerchio:
#   triangles = triangoli chiari      bubbles = mini cerchi, come bolle subacquee
# (quello che esce dal cerchio resta sempre fatto di triangoli azzurri)
shape = bubbles

# Effetto dentro il cerchio:
#   pulse  = anelli che partono dal centro (battito)
#   liquid = liquido che si muove nel cerchio, come la "palla" degli assistenti vocali
inner = liquid

# Colore del liquido: esadecimale RRGGBB, SENZA "#" (in questo file "#" inizia un commento).
# Esempi: 0083C8 azzurro (predefinito), 7B5CFF viola, 22C55E verde, FF7A1A arancio
liquid_color = 0083C8

# Effetto interno: la CPU ne determina la velocità, la RAM la luminosità (non è configurabile).

# Dimensione delle forme (1.0 = normale)
tri_size = 0.6

# Sorgente dell'audio: auto | bridge | loopback
#   auto     = bridge se raggiungibile, altrimenti cattura dalla scheda audio (va bene ovunque)
#   bridge   = barre di cava lette da un servizio HTTP "mpd-spectrum" (impianto personalizzato di MPD: non
#              esiste di serie, quindi non è il predefinito)
#   loopback = cattura diretta dell'audio in uscita
# Le impostazioni di una singola macchina (es. audio_source = bridge) vanno in config.local.ini,
# stessa cartella, non tracciato da git: ha la precedenza su questo file.
audio_source = auto

# Opzioni del bridge e della cattura diretta (valgono per desktop e web), da adattare nel file locale:
# bridge_url = http://127.0.0.1:44883/bars
# bridge_scale = 22        # media delle barre (0-100) = livello massimo
# audio_device =           # parte del nome del dispositivo, solo per audio_source = loopback
# audio_gain = 0           # dB aggiunti

# Mbit/s corrispondenti all'effetto massimo di download/upload
max_mbps = 200

# Monitor: auto = quello del terminale da cui si lancia, oppure indice (0, 1, ...)
display = auto
